# -------------------------------------------------
# Noise Generation
# -------------------------------------------------
noise:
    channel_00|channel_01:
        csd_tag: default
    
# -------------------------------------------------
# SALTING PROCESSING
# -------------------------------------------------
salting:
    channel_00,channel_01:
        template_tag: LEE_single
        collection_efficiency: [1.0]
        pdf_tag: LEE_single
        pdf_bounds: [0.0,20.0]
        rate: 1.23
        
    channel_00|channel_01:
        template_tag: LEE_shared
        collection_efficiency: [1.0,1.0]
        pdf_tag: LEE_shared
        pdf_bounds: [0.0,20.0]
        rate: 2














